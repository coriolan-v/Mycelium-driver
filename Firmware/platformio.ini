; Mushroom firmware v3.0 for Teensy 4.1
[platformio]
default_envs = teensy41
src_dir = Mushroom_FW_3.0
lib_dir = Libraries

[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/firmware_name.py
board_build.f_cpu = 600000000L
build_flags =
    -D TEENSY_OPT_FASTEST_LTO
    -D QNETHERNET_DO_LOOP_IN_YIELD=0
lib_deps =
    ssilverman/QNEthernet@0.37.0
lib_ignore =
    Artnet
    NativeEthernet
    FNET
